name: Build Android APK

on:
  # 手动触发（推荐）：在仓库 Actions 页面点 "Run workflow"
  workflow_dispatch:
  # 推送 android_version 或本工作流时自动触发
  push:
    branches: [ master ]
    paths:
      - 'android_version/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            libltdl-dev libffi-dev libssl-dev zlib1g-dev \
            libncurses5-dev libsqlite3-dev libreadline-dev \
            tk-dev libgdbm-dev libc6-dev flex bison g++
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> "$GITHUB_ENV"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer

      - name: Build APK (buildozer android debug)
        working-directory: android_version
        run: buildozer android debug 2>&1 | tee /tmp/buildozer.log

      - name: Show buildozer log on failure
        if: failure()
        run: |
          echo "==== buildozer.log tail ===="
          tail -n 80 /tmp/buildozer.log || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-doc-apk
          path: android_version/bin/*.apk
          if-no-files-found: warn
